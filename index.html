<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PETier API docs V2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#0d131a;color:#e6ebf2;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.hidden{display:none!important}
.app{display:flex;min-height:100vh}
.sidebar{width:232px;flex-shrink:0;background:#10161d;border-right:1px solid #1b2430;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:18px 18px 14px;font-size:16px;font-weight:800;letter-spacing:.4px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#42a5f5,#b35cff);box-shadow:0 0 10px #42a5f5}
#nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;color:#9aa6b6;font-size:14px;font-weight:600;cursor:pointer;transition:.12s}
.nav-item:hover{background:#161f2a;color:#fff}
.nav-item.active{background:linear-gradient(135deg,rgba(66,165,245,.16),rgba(179,92,255,.16));color:#fff;box-shadow:inset 0 0 0 1px #223044}
.nav-item i{width:16px;text-align:center;font-size:14px}
.side-foot{border-top:1px solid #1b2430;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.who{font-size:12px;color:#7d8a9b;word-break:break-all}
.content{flex:1;min-width:0;padding:26px 30px;max-width:1080px;margin:0 auto;width:100%}
.panel-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.panel-head h2{font-size:22px;font-weight:800}
.panel-head .spacer{flex:1}
.count{font-size:12px;color:#7d8a9b;background:#141c26;border:1px solid #1f2a38;padding:3px 9px;border-radius:999px}
.sub{font-size:12px;color:#8a97a8;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin:20px 0 10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid #1f2a38;font-size:13px;font-weight:600;color:#e6ebf2;background:#161f2a;transition:.13s}
.btn:hover{background:#1c2836}.btn:active{transform:scale(.97)}
.btn.primary{background:#e5e7eb;color:#101828;border-color:transparent}.btn.primary:hover{background:#fff}
.btn.danger{background:rgba(255,101,104,.14);color:#ff8a8c;border-color:rgba(255,101,104,.35)}.btn.danger:hover{background:rgba(255,101,104,.24)}
.btn.small{padding:5px 10px;font-size:12px}.btn.block{width:100%;justify-content:center}
.inp{background:rgba(155,187,245,.06);border:1px solid #223044;color:#fff;padding:8px 11px;border-radius:8px;outline:none;font-size:14px}
.inp:focus{border-color:#42536b;box-shadow:0 0 0 3px rgba(66,165,245,.12)}
.search{width:200px}
.prow{display:flex;align-items:center;gap:12px;background:#10161d;border:1px solid #1b2430;border-radius:11px;padding:10px 14px;margin:8px 0;transition:.13s}
.prow:hover{border-color:#26374a;background:#121a24}
.prow .pid{font-family:ui-monospace,monospace;font-size:12px;color:#64748b;width:48px;flex-shrink:0}
.prow .pname{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .ptitle{font-size:12px;flex-shrink:0;white-space:nowrap}
.prow .pact{display:flex;gap:6px;flex-shrink:0}
.region{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:4px 9px;border-radius:7px;font-size:12px;font-weight:800;border:1px solid currentColor;flex-shrink:0}
.card{background:#10161d;border:1px solid #1b2430;border-radius:12px;padding:20px}
.card.narrow{max-width:420px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;color:#8a97a8;margin-bottom:5px;font-weight:600}
.form-row input,.form-row select{width:100%;background:rgba(155,187,245,.06);border:1px solid #223044;color:#fff;padding:9px 11px;border-radius:8px;outline:none;font-size:14px}
.form-row input:focus,.form-row select:focus{border-color:#42536b}
.color-inline{display:flex;gap:8px;align-items:center}.color-inline input{flex:1}
.color-preview{width:32px;height:32px;border-radius:7px;border:1px solid #334;flex-shrink:0;background:transparent}
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mode-grid .m{background:rgba(155,187,245,.04);border:1px solid #1c2836;border-radius:9px;padding:9px}
.mode-grid .m .mname{font-size:12px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.mode-grid .m .mname img{width:15px;height:15px;object-fit:contain}
.mode-grid .m .msel{display:flex;gap:6px}
.mode-grid .m .msel select{flex:1;font-size:12px;padding:6px;min-width:0;border-radius:6px}
.hint{font-size:12px;color:#64748b;margin-top:10px}
.login-gate{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 60px)}
.login-card{width:100%;max-width:360px;background:#10161d;border:1px solid #1b2430;border-radius:16px;padding:28px}
.login-card h1{font-size:20px;margin-bottom:4px}
.login-card .sub2{font-size:13px;color:#7d8a9b;margin-bottom:20px}
.err{color:#ff8a8c;font-size:13px;margin-top:10px;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.stat{background:#10161d;border:1px solid #1b2430;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat .sname{font-weight:700;font-size:14px;color:#e6ebf2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .snum{font-size:12px;color:#90cfff;white-space:nowrap}
.logs{display:flex;flex-direction:column;gap:6px}
.log{background:#10161d;border:1px solid #1b2430;border-radius:9px;padding:9px 12px;font-size:12.5px}
.log .ltop{display:flex;flex-wrap:wrap;gap:7px;align-items:center;color:#c3cdda}
.log .ltop b{color:#fff}
.log .ltop .time{margin-left:auto;color:#5b6a7d;font-size:11px}
.log .ldetail{color:#8a97a8;margin-top:4px;font-family:ui-monospace,monospace;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.box{background:#0f151d;border:1px solid #1e2a38;border-radius:16px;padding:22px;width:100%;max-width:820px;max-height:92vh;overflow-y:auto;position:relative}
.box .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:#161f2a;color:#b4bdc7;border:none;font-size:15px}
.box h2{font-size:19px;margin-bottom:16px;color:#fff}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
@media(max-width:768px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;border-right:none;border-bottom:1px solid #1b2430;overflow-x:auto;padding:6px}
  .brand{display:none}
  #nav{flex-direction:row;padding:0;gap:4px}
  .nav-item{white-space:nowrap;padding:9px 12px;font-size:13px}
  .side-foot{flex-direction:row;align-items:center;border-top:none;border-left:1px solid #1b2430;padding:6px 10px;margin-left:auto}
  .who{font-size:11px;max-width:120px}
  .content{padding:16px}
  .mode-grid{grid-template-columns:1fr}
  .search{width:120px}
  .prow .ptitle{display:none}
}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>PETier 管理后台</div>
    <nav id="nav">
      <div class="nav-item active" data-tab="players"><i class="fa-solid fa-users"></i>玩家管理</div>
      <div class="nav-item" data-tab="register"><i class="fa-solid fa-user-plus"></i>注册账号</div>
      <div class="nav-item" data-tab="logs"><i class="fa-solid fa-clipboard-list"></i>操作日志</div>
      <div class="nav-item" data-tab="password"><i class="fa-solid fa-key"></i>修改密码</div>
    </nav>
    <div class="side-foot">
      <div class="who" id="whoAmI">未登录</div>
      <button class="btn danger small hidden" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i>退出</button>
    </div>
  </aside>

  <main class="content">

    <div class="login-gate" id="loginGate">
      <div class="login-card">
        <h1>PETier 管理后台</h1>
        <p class="sub2">管理员登录</p>
        <div class="form-row"><label>用户名</label><input id="loginUser" placeholder="用户名"></div>
        <div class="form-row"><label>密码</label><input id="loginPass" type="password" placeholder="密码"></div>
        <button class="btn primary block" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i>登录</button>
        <p class="err" id="loginErr"></p>
      </div>
    </div>

    <div id="panels" class="hidden">

      <section class="panel" id="panel-players">
        <div class="panel-head">
          <h2>玩家管理</h2>
          <span class="count" id="pcount">0</span>
          <div class="spacer"></div>
          <input class="inp search" id="searchBox" placeholder="搜索玩家 / 地区">
          <button class="btn primary" id="addBtn"><i class="fa-solid fa-plus"></i>新增玩家</button>
        </div>
        <div id="playerList"><div style="padding:40px 0;text-align:center;color:#64748b">加载中...</div></div>
      </section>

      <section class="panel hidden" id="panel-register">
        <div class="panel-head"><h2>注册测试员账号</h2></div>
        <div class="card narrow">
          <div class="form-row"><label>用户名</label><input id="regUser" placeholder="测试员登录名"></div>
          <div class="form-row"><label>密码（至少 6 位）</label><input id="regPass" type="password" placeholder="登录密码"></div>
          <button class="btn primary block" id="regSubmit"><i class="fa-solid fa-user-plus"></i>创建账号</button>
          <p class="hint">只有超级管理员能创建测试员账号；测试员登录后只能管理玩家数据。</p>
          <p class="err" id="regMsg"></p>
        </div>
      </section>

      <section class="panel hidden" id="panel-logs">
        <div class="panel-head">
          <h2>操作日志</h2>
          <div class="spacer"></div>
          <button class="btn" id="reloadLogs"><i class="fa-solid fa-rotate"></i>刷新</button>
        </div>
        <h3 class="sub">每个测试员：总次数 / 本月次数</h3>
        <div class="stats" id="logStats"></div>
        <h3 class="sub">最近操作</h3>
        <div class="logs" id="logList"></div>
      </section>

      <section class="panel hidden" id="panel-password">
        <div class="panel-head"><h2>修改密码</h2></div>
        <div class="card narrow">
          <div class="form-row"><label>旧密码</label><input id="oldPass" type="password"></div>
          <div class="form-row"><label>新密码（至少 6 位）</label><input id="newPass" type="password"></div>
          <button class="btn primary block" id="pwdSubmit"><i class="fa-solid fa-key"></i>确认修改</button>
          <p class="err" id="pwdMsg"></p>
        </div>
      </section>

    </div>
  </main>
</div>

<div class="modal" id="editModal">
  <div class="box">
    <button class="x" id="editClose"><i class="fa-solid fa-xmark"></i></button>
    <h2 id="editTitle">新增玩家</h2>
    <input type="hidden" id="editId">
    <div class="form-row"><label>玩家名称</label><input id="formName" placeholder="玩家 ID"></div>
    <div class="form-row"><label>名字颜色（十六进制，留空默认白色）</label>
      <div class="color-inline"><input id="formColor" placeholder="#ffffff"><span class="color-preview" id="colorPreview"></span></div>
    </div>
    <div class="form-row"><label>地区</label><select id="formRegion"></select></div>
    <div class="form-row"><label>备注</label><input id="formNote" placeholder="选填"></div>
    <h3 class="sub" style="margin-top:16px">各模式 Tier（每行左=当前，右=巅峰）</h3>
    <div class="mode-grid" id="modeGrid"></div>
    <div class="foot"><button class="btn" id="editCancel">取消</button><button class="btn primary" id="editSubmit">保存</button></div>
  </div>
</div>
<script>
const API='https://petierapi.ccwu.cc';
const MODES=[
 {code:'sword',name:'Sword',icon:'sword'},{code:'axe',name:'Axe',icon:'axe'},{code:'smp',name:'SMP',icon:'smp'},{code:'buhc',name:'BUHC',icon:'buhc'},
 {code:'vanilla',name:'Vanilla',icon:'vanilla'},{code:'mace',name:'Mace',icon:'mace'},{code:'pot',name:'Pot',icon:'pot'},{code:'nethpot',name:'NethPot',icon:'nethop'},
 {code:'single',name:'Single',icon:null},{code:'archer',name:'Archer',icon:null},{code:'opot',name:'OPot',icon:null},{code:'uhc',name:'UHC',icon:'uhc'},
 {code:'bedwars',name:'Bedwars',icon:null},{code:'fireball',name:'Fireball',icon:null},{code:'sumo',name:'Sumo',icon:null},{code:'boxing',name:'Boxing',icon:null}
];
const TIER_SCORE={HT1:60,RHT1:60,LT1:45,RLT1:45,HT2:30,RHT2:30,LT2:20,RLT2:20,HT3:10,LT3:6,HT4:4,LT4:3,HT5:2,LT5:1,'-':0};
const TITLES=[
 {name:'Combat Grandmaster',min:800,color:'#ffd700',icon:'fa-crown'},
 {name:'Combat Master',min:500,color:'#b35cff',icon:'fa-medal'},
 {name:'Combat Ace',min:200,color:'#42a5f5',icon:'fa-award'},
 {name:'Combat Specialist',min:100,color:'#36d399',icon:'fa-star'},
 {name:'Combat Cadet',min:40,color:'#f2ee63',icon:'fa-shield-halved'},
 {name:'Combat Novice',min:20,color:'#ff8533',icon:'fa-fire'},
 {name:'Rookie',min:0,color:'#868686',icon:'fa-seedling'}
];
const REGION_COLORS={'华东':{bg:'rgba(27,165,35,.12)',fg:'#61eb69'},'华南':{bg:'rgba(143,45,92,.12)',fg:'#d573a2'},'华北':{bg:'rgba(209,174,6,.12)',fg:'#fff44c'},'华中':{bg:'rgba(2,149,108,.12)',fg:'#48dbb2'},'西南':{bg:'rgba(31,146,175,.12)',fg:'#65d8f5'},'西北':{bg:'rgba(186,99,6,.12)',fg:'#ffa94c'},'东北':{bg:'rgba(185,80,78,.12)',fg:'#ff9694'},'港澳台':{bg:'rgba(120,32,122,.12)',fg:'#be66c0'},'其它':{bg:'rgba(42,42,42,.4)',fg:'#999999'}};
const REGION_LIST=['华东','华南','华北','华中','西南','西北','东北','港澳台','其它'];
const ALL_TIERS=['-','HT1','LT1','HT2','LT2','HT3','LT3','HT4','LT4','HT5','LT5','RHT1','RLT1','RHT2','RLT2'];

let token=localStorage.getItem('petier_token')||'';
let me=null;
let players=[];
let search='';

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(s){return String(s||'').replace('T',' ').replace('Z','').slice(0,16);}
function titleOf(p){return TITLES.find(t=>p>=t.min)||TITLES[TITLES.length-1];}
function tierScore(t){return TIER_SCORE[t]||0;}
function getTier(p,c){const t=p.tiers&&p.tiers[c];return (t&&t.tier)?t.tier:'-';}
function getPeak(p,c){const t=p.tiers&&p.tiers[c];return (t&&t.peak)?t.peak:'-';}
function calcTotal(p){let s=0;MODES.forEach(m=>s+=tierScore(getTier(p,m.code)));return s;}
function iconUrl(ic){return ic?('https://mctiers.com/tier_icons/'+ic+'.svg'):'';}
function modeIcon(m,size){size=size||15;const u=iconUrl(m.icon);if(u){return '<img src="'+u+'" style="width:'+size+'px;height:'+size+'px;object-fit:contain" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-block\'" alt="'+esc(m.name)+'"><span style="display:none">'+esc(m.name.slice(0,2))+'</span>';}return '<span style="font-size:'+size+'px;color:#8a97a8">'+esc(m.name.slice(0,2))+'</span>';}

async function api(path,opts){
  opts=opts||{};
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(token)opts.headers['Authorization']='Bearer '+token;
  const res=await fetch(API+path,opts);
  let data=null;try{data=await res.json();}catch(e){}
  if(!res.ok){throw new Error((data&&(data.error||data.msg))||('HTTP '+res.status));}
  return data;
}

function buildFormStatic(){
  $('formRegion').innerHTML=REGION_LIST.map(r=>'<option value="'+esc(r)+'">'+esc(r)+'</option>').join('');
  const opts=ALL_TIERS.map(t=>'<option value="'+t+'">'+t+'</option>').join('');
  $('modeGrid').innerHTML=MODES.map(m=>'<div class="m"><div class="mname">'+modeIcon(m,15)+esc(m.name)+'</div><div class="msel"><select id="cur_'+m.code+'">'+opts+'</select><select id="pk_'+m.code+'">'+opts+'</select></div></div>').join('');
}

function switchTab(tab){
  const allowed=['players','logs','password'];
  if(me&&me.role==='super')allowed.push('register');
  if(allowed.indexOf(tab)<0)tab='players';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));
  ['players','register','logs','password'].forEach(t=>$('panel-'+t).classList.toggle('hidden',t!==tab));
  if(tab==='logs')loadLogs();
}

async function login(){
  const u=$('loginUser').value.trim(),p=$('loginPass').value;
  $('loginErr').textContent='';
  if(!u||!p){$('loginErr').textContent='请输入用户名和密码';return;}
  try{
    const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
    token=d.token;localStorage.setItem('petier_token',token);
    me={username:d.username||u,role:d.role||'tester'};
    applyRoleUI();switchTab('players');await loadPlayers();
  }catch(e){$('loginErr').textContent='登录失败：'+e.message;}
}

function logout(){
  token='';me=null;localStorage.removeItem('petier_token');
  $('loginGate').classList.remove('hidden');$('panels').classList.add('hidden');
  $('whoAmI').textContent='未登录';$('logoutBtn').classList.add('hidden');
}

function applyRoleUI(){
  if(!me)return;
  $('loginGate').classList.add('hidden');$('panels').classList.remove('hidden');
  $('whoAmI').textContent=me.username+' · '+(me.role==='super'?'超级管理员':'测试员');
  $('logoutBtn').classList.remove('hidden');
  const regNav=document.querySelector('.nav-item[data-tab="register"]');
  if(regNav)regNav.classList.toggle('hidden',me.role!=='super');
  $('addBtn').classList.toggle('hidden',me.role!=='tester');
}
async function loadPlayers(){
  try{
    const d=await api('/api/players?limit=500');
    players=d.players||[];
    renderPlayers();
  }catch(e){
    $('playerList').innerHTML='<div style="padding:40px 0;text-align:center;color:#ff8a8c">加载失败：'+esc(e.message)+'</div>';
  }
}

function renderPlayers(){
  const canEdit=me&&me.role==='tester';
  let arr=players.slice();
  if(search.trim()){
    const kw=search.trim().toLowerCase();
    arr=arr.filter(p=>(p.name||'').toLowerCase().includes(kw)||(p.region||'').toLowerCase().includes(kw));
  }
  arr.sort((a,b)=>a.id-b.id);
  $('pcount').textContent=arr.length+' 位';
  const box=$('playerList');
  if(!arr.length){box.innerHTML='<div style="padding:40px 0;text-align:center;color:#64748b">暂无玩家</div>';return;}
  box.innerHTML=arr.map(p=>{
    const total=calcTotal(p);
    const t=titleOf(total);
    const region=p.region||'其它';
    const rc=REGION_COLORS[region]||REGION_COLORS['其它'];
    const nc=(p.color&&/^#[0-9a-fA-F]{6}$/.test(p.color))?p.color:'#e6ebf2';
    let acts='';
    if(canEdit){
      acts='<button class="btn small" data-edit="'+p.id+'"><i class="fa-solid fa-pen"></i>编辑</button>'
          +'<button class="btn small danger" data-del="'+p.id+'"><i class="fa-solid fa-trash"></i>删除</button>';
    }
    return '<div class="prow">'
      +'<span class="pid">#'+p.id+'</span>'
      +'<span class="pname" style="color:'+nc+'">'+esc(p.name)+'</span>'
      +'<span class="region" style="background:'+rc.bg+';color:'+rc.fg+'">'+esc(region)+'</span>'
      +'<span class="ptitle" style="color:'+t.color+'"><i class="fa-solid '+t.icon+'"></i> '+esc(t.name)+' <span style="color:#475569">('+total+')</span></span>'
      +'<span class="pact">'+acts+'</span>'
      +'</div>';
  }).join('');
}

function openAdd(){
  $('editTitle').textContent='新增玩家';
  $('editId').value='';$('formName').value='';$('formColor').value='';$('formNote').value='';
  $('colorPreview').style.background='transparent';$('formRegion').value='其它';
  MODES.forEach(m=>{$('cur_'+m.code).value='-';$('pk_'+m.code).value='-';});
  $('editModal').classList.add('show');
}

function openEdit(id){
  const p=players.find(x=>x.id===id);if(!p)return;
  $('editTitle').textContent='编辑：'+p.name;
  $('editId').value=p.id;$('formName').value=p.name||'';$('formColor').value=p.color||'';
  $('formNote').value=p.note||'';$('formRegion').value=REGION_COLORS[p.region]?p.region:'其它';
  $('colorPreview').style.background=(p.color&&/^#[0-9a-fA-F]{6}$/.test(p.color))?p.color:'transparent';
  MODES.forEach(m=>{$('cur_'+m.code).value=getTier(p,m.code);$('pk_'+m.code).value=getPeak(p,m.code);});
  $('editModal').classList.add('show');
}

async function submitEdit(){
  const id=$('editId').value;
  const tiers={};
  MODES.forEach(m=>{tiers[m.code]={tier:$('cur_'+m.code).value,peak:$('pk_'+m.code).value};});
  const body={name:$('formName').value.trim(),color:$('formColor').value.trim()||'#FFFFFF',note:$('formNote').value.trim(),region:$('formRegion').value,tiers:tiers};
  if(!body.name){alert('请填玩家名称');return;}
  try{
    if(id){await api('/api/players/'+id,{method:'PUT',body:JSON.stringify(body)});}
    else{await api('/api/players',{method:'POST',body:JSON.stringify(body)});}
    $('editModal').classList.remove('show');
    await loadPlayers();
  }catch(e){alert('保存失败：'+e.message);}
}

async function deletePlayer(id){
  const p=players.find(x=>x.id===id);if(!p)return;
  if(!confirm('确定删除玩家 '+p.name+' ？'))return;
  try{await api('/api/players/'+id,{method:'DELETE'});await loadPlayers();}
  catch(e){alert('删除失败：'+e.message);}
}

async function submitRegister(){
  const u=$('regUser').value.trim(),p=$('regPass').value;
  $('regMsg').textContent='';
  if(!u||p.length<6){$('regMsg').style.color='#ff8a8c';$('regMsg').textContent='用户名不能为空，密码至少6位';return;}
  try{
    await api('/api/register',{method:'POST',body:JSON.stringify({username:u,password:p})});
    $('regUser').value='';$('regPass').value='';
    $('regMsg').style.color='#36d399';$('regMsg').textContent='创建成功：'+u;
  }catch(e){$('regMsg').style.color='#ff8a8c';$('regMsg').textContent='失败：'+e.message;}
}

async function loadLogs(){
  try{
    const d=await api('/api/logs');
    const stats=d.stats||[],logs=d.logs||[];
    let sh='';if(!stats.length)sh='<div style="color:#64748b;font-size:13px">暂无记录</div>';
    stats.forEach(s=>{sh+='<div class="stat"><span class="sname">'+esc(s.admin_name)+'</span><span class="snum">总 '+s.total+' · 本月 '+s.this_month+'</span></div>';});
    $('logStats').innerHTML=sh;
    let lh='';if(!logs.length)lh='<div style="color:#64748b;font-size:13px">暂无记录</div>';
    logs.forEach(l=>{lh+='<div class="log"><div class="ltop"><b>'+esc(l.admin_name)+'</b><span>'+esc(l.action)+'</span><span>'+esc(l.player_name||'')+'</span><span class="time">'+esc(fmtDate(l.created_at))+'</span></div><div class="ldetail">'+esc(l.detail||'')+'</div></div>';});
    $('logList').innerHTML=lh;
  }catch(e){$('logList').innerHTML='<div style="color:#ff8a8c;font-size:13px">加载失败：'+esc(e.message)+'</div>';}
}

async function submitPassword(){
  const o=$('oldPass').value,n=$('newPass').value;
  $('pwdMsg').textContent='';
  if(!o||n.length<6){$('pwdMsg').style.color='#ff8a8c';$('pwdMsg').textContent='新密码至少6位';return;}
  try{
    await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({oldPassword:o,newPassword:n})});
    $('oldPass').value='';$('newPass').value='';
    $('pwdMsg').style.color='#36d399';$('pwdMsg').textContent='密码修改成功';
  }catch(e){$('pwdMsg').style.color='#ff8a8c';$('pwdMsg').textContent='失败：'+e.message;}
}

function bindEvents(){
  $('loginBtn').addEventListener('click',login);
  $('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
  $('logoutBtn').addEventListener('click',logout);
  document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchTab(n.dataset.tab)));
  $('searchBox').addEventListener('input',e=>{search=e.target.value;renderPlayers();});
  $('addBtn').addEventListener('click',openAdd);
  $('editClose').addEventListener('click',()=>$('editModal').classList.remove('show'));
  $('editCancel').addEventListener('click',()=>$('editModal').classList.remove('show'));
  $('editSubmit').addEventListener('click',submitEdit);
  $('editModal').addEventListener('click',e=>{if(e.target===$('editModal'))$('editModal').classList.remove('show');});
  $('formColor').addEventListener('input',()=>{
    const v=$('formColor').value.trim();
    $('colorPreview').style.background=/^#[0-9a-fA-F]{6}$/.test(v)?v:'transparent';
  });
  $('playerList').addEventListener('click',e=>{
    const eb=e.target.closest('[data-edit]');if(eb){openEdit(Number(eb.dataset.edit));return;}
    const db=e.target.closest('[data-del]');if(db){deletePlayer(Number(db.dataset.del));return;}
  });
  $('regSubmit').addEventListener('click',submitRegister);
  $('reloadLogs').addEventListener('click',loadLogs);
  $('pwdSubmit').addEventListener('click',submitPassword);
}

document.addEventListener('DOMContentLoaded',async()=>{
  buildFormStatic();
  bindEvents();
// 不主动请求 /api/me，避免 401；直接进入待登录状态
logout();
});
</script>
</body>
</html>
